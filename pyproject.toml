[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xenrouter"
version = "0.1.0"
description = "Ultra-lightweight Unified Local Inference Router and TUI"
authors = [
    { name = "Abeer Kumar", email = "theabeerkumar@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.1"
]

[project.scripts]
xenrouter = "xenrouter.cli:main"
