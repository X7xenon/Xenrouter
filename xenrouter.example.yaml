# Xenrouter Configuration Template
# Copy to xenrouter.yaml and fill in your own API keys (or configure Hermes / .env).
host: 127.0.0.1
port: 8989
auto_probe_local: true
import_hermes_providers: true
health_check_interval: 15.0
default_model: deepseek-v4.1-flash
max_history_logs: 200
backends:
- name: ollama
  type: ollama
  base_url: http://127.0.0.1:11434
  enabled: true
  priority: 1
  timeout: 180.0
  max_concurrency: 4
- name: lmstudio
  type: lmstudio
  base_url: http://127.0.0.1:1234
  enabled: true
  priority: 2
  timeout: 180.0
  max_concurrency: 2
- name: llamacpp
  type: llamacpp
  base_url: http://127.0.0.1:8080
  enabled: true
  priority: 3
  timeout: 180.0
  max_concurrency: 2
- name: vllm
  type: vllm
  base_url: http://127.0.0.1:8000
  enabled: true
  priority: 1
  timeout: 180.0
  max_concurrency: 8
  key_rotation_strategy: round_robin
  key_cooldown_seconds: 60.0
  api_keys:
  - sk-local-vllm-alpha
  - sk-local-vllm-beta
# - name: coarena
#   type: openai_compatible
#   base_url: https://coarena.ai/api/v1
#   api_keys:
#   - YOUR_COARENA_API_KEY
#   key_rotation_strategy: round_robin
#   key_cooldown_seconds: 60.0
#   enabled: true
#   priority: 1
#   timeout: 60.0
#   max_concurrency: 8
aliases:
  auto:
    targets:
    - free/deepseek-v4.1-flash
    - coding
    - fast
    - general
    description: Priority auto-routing cascade across free daily and uncapped backends
    strategy: priority
  coding:
    targets:
    - free/deepseek-v4.1-flash
    - qwen3.8-omni-flash:free
    - wusrouter/qwen3.8-flash:free
    - coarena/gemini-3-8-flash
    - coarena/deepseek-v4-1-flash-1017
    - coarena/claude-sonnet-5-5
    - coarena/qwen3-8-2-4t-a95b
    - qwen/qwen3.8-27b
    - deepseek-v4.1-flash:free
    - deepseek-ai/DeepSeek-V4.1-Flash
    - mercury-3
    description: Coding cascade across daily-limit, grant, and permanent free pools
    strategy: priority
  fast:
    targets:
    - free/deepseek-v4.1-flash
    - mercury-2.5
    - coarena/glm-5-3-flash
    - coarena/gemini-3-8-flash
    - gemini-3.8-flash
    - wusrouter/qwen3.8-flash:free
    description: Low-latency inference cascade
    strategy: priority
  reasoning:
    targets:
    - free/deepseek-v4.1-flash
    - mercury-decide
    - coarena/claude-opus-5-5
    - claude-opus-5-5
    - DeepSeek-R1-Distill-Qwen-7B
    - mercury-3
    - gemini-3.8-flash
    description: Deep reasoning cascade
    strategy: priority
  general:
    targets:
    - free/deepseek-v4.1-flash
    - gemini-3.8-flash
    - gpt-6-astra
    - openai/gpt-oss-120b
    - coarena/gemini-3-8-flash
    - coarena/gpt-6-astra
    - coarena/claude-sonnet-5-5
    description: General conversational cascade
    strategy: priority
